[[block]]
block = "backlight"
format = " BRIGHT $brightness "

[[block]]
block = "sound"
driver = "auto"
format = " $icon {$volume |}"

[[block]]
block = "net"
device = "wlp2s0"
format = " ⇣$speed_down ⇡$speed_up "
inactive_format = " NET Down "
interval = 5

[[block]]
block = "time"
format = " $timestamp.datetime(f:'%H:%M') "
interval = 60

[[block]]
block = "battery"
driver = "sysfs"
interval = 10
format = " BAT $percentage $power "
charging_format =  " CHG $percentage $power "
not_charging_format = " PLUG " 
