[[block]]
block = "tea_timer"
format = " $icon {$minutes:$seconds |}"
done_cmd = "notify-send 'Tea Time!'"
increment = 60

[[block]]
block = "backlight"
format = " BRIGHT $brightness "

[[block]]
block = "sound"
driver = "auto"
format = " $icon {$volume |}"

[[block]]
block = "net"
device = "wlp2s0"
format = " ⇣$speed_down ⇡$speed_up "
inactive_format = " NET DOWN "
interval = 5

[[block]]
block = "time"
format = " $timestamp.datetime(f:'%H:%M') "
interval = 60

[[block]]
block = "battery"
driver = "sysfs"
format = " $icon $percentage $power "
charging_format =  " $icon $percentage $power "
not_charging_format = " PLUG " 
interval = 10
